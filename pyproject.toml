[project]
name = "random-items"
version = "0.1.0"
description = "FastAPI REST API for CRUD string items with randomized retrieval"
readme = "README.md"
authors = [
    { name = "Joshua Stevens", email = "stevensjoshuaisbatman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
random-items = "random_items.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
